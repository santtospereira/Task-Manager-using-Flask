name: Pipeline DevSecOps - Gestão de Tarefas

on:
  push:
    branches: [ master, estagio, desenvolvimento ]
  pull_request:
    branches: [ master, estagio, desenvolvimento ]

permissions:
  contents: read
  issues: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v3

    - name: Inicializar ambiente Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Validar integridade e instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validar compilacao do ambiente em Container Docker
      run: |
        docker build -t task-manager-ci:${{ github.sha }} .

  sast-analysis:
    runs-on: ubuntu-latest
    needs: build-and-validate

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v3

    - name: Inicializar Python para o SAST
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar o Bandit
      run: pip install bandit

    - name: Executar Analise Estatica (SAST) com Bandit
      run: bandit -r . -x ./venv -v || true

  dependency-check:
    runs-on: ubuntu-latest
    needs: sast-analysis

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v3

    - name: Executar Analise de Dependencia (SCA) com OWASP Dependency-Check
      uses: dependency-check/DependencyCheck_Action@main
      with:
        project: 'Task-Manager-Flask'
        path: '.'
        format: 'HTML'
        out: 'reports'

  review-environment:
    runs-on: ubuntu-latest
    needs: dependency-check
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v3

    - name: Inicializar Ambiente Temporario de Revisao
      run: |
        docker build -t task-manager-review .
        docker run -d -p 5001:5000 --name app_review task-manager-review
        sleep 5
        docker ps

  deploy-stage:
    runs-on: ubuntu-latest
    needs: dependency-check
    if: github.ref == 'refs/heads/estagio' || github.base_ref == 'estagio'

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v3

    - name: Implantar em Ambiente de Estagio
      run: |
        docker build -t task-manager-stage .
        docker run -d -p 5002:5000 --name app_stage task-manager-stage
        sleep 5

    - name: Executar OWASP ZAP Pós-Deploy em Estágio
      run: |
        docker run --user root -v $(pwd):/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://172.17.0.1:5002 -g gen.conf -r relatorio_stage_dast.html || true

    - name: Upload do Relatorio DAST de Estagio
      uses: actions/upload-artifact@v4
      with:
        name: relatorio-dast-estagio
        path: relatorio_stage_dast.html

  post-deployment-monitoring:
    runs-on: ubuntu-latest
    needs: deploy-stage
    if: github.ref == 'refs/heads/estagio' || github.base_ref == 'estagio'

    steps:
    - name: Simular Inicializacao de Agente de Monitoramento (ELK/Wazuh)
      run: |
        echo "Iniciando a instalacao das ferramentas de monitoramento pós-implantacao..."
        echo "Instalando agente de analise de logs em producao/estagio..."
        # Simula a verificacao e escuta ativa de anomalias (ex: tentativas de forca bruta)
        echo "Agente configurado para inspecionar falhas de autenticacao de anomalias."
        echo "Monitoramento ativo e integrado com sucesso."