name: Pipeline DevSecOps - Gestão de Tarefas

on:
  push:
    branches: [ master, estagio, desenvolvimento ]
  pull_request:
    branches: [ master, estagio ]

permissions:
  contents: read
  issues: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v4

    - name: Inicializar ambiente Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Validar integridade e instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Validar compilacao do ambiente em Container Docker
      run: |
        docker build -t task-manager-ci:${{ github.sha }} .

  sast-analysis:
    runs-on: ubuntu-latest
    needs: build-and-validate

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v4

    - name: Inicializar Python para o SAST
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar o Bandit
      run: pip install bandit

    - name: Executar Analise Estatica (SAST) com Bandit
      run: bandit -r . -x ./venv -v || true

  dependency-check:
    runs-on: ubuntu-latest
    needs: sast-analysis

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v4

    - name: Executar Analise de Dependencia (SCA) com OWASP Dependency-Check
      uses: dependency-check/DependencyCheck_Action@main
      with:
        project: 'Task-Manager-Flask'
        path: '.'
        format: 'HTML'
        out: 'reports'

  dast-analysis:
    runs-on: ubuntu-latest
    needs: dependency-check

    steps:
    - name: Checkout do codigo fonte
      uses: actions/checkout@v4

    - name: Inicializar Aplicacao em Container Docker
      run: |
        docker build -t task-manager-dast .
        docker run -d -p 5000:5000 --name app_dast task-manager-dast
        sleep 5

    - name: Executar Analise Dinamica (DAST) com OWASP ZAP
      uses: zaproxy/action-baseline@v0.13.0
      with:
        target: 'http://localhost:5000'
        token: ${{ secrets.GITHUB_TOKEN }}
        fail_action: false
        artifact_name: 'zap-scan-report'